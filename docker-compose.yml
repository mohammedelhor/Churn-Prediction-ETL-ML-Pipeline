version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./joblib:/app/joblib
    restart: unless-stopped

  # يشتغل عند الطلب فقط: docker compose run --rm etl
  # (بدون رفع BigQuery افتراضيًا — فاكر إن credentials تسجيل الدخول
  # عن طريق gcloud محفوظة على جهازك، مش متاحة تلقائيًا جوه الـ
  # container. لو عايز BigQuery يشتغل من جوه Docker، محتاج تربط
  # ملف الـ credentials كـ volume إضافي هنا)
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_etl
    command: ["python", "-m", "src.data.pipeline"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    profiles:
      - etl

  # airflow standalone: أمر مخصص للتطوير المحلي والعروض التقديمية —
  # بيعمل db init، ينشئ admin user تلقائيًا، ويشغّل webserver+scheduler
  # مع بعض في نفس العملية. مش للإنتاج (production بيحتاج Postgres +
  # executor موزّع، مش SQLite + عملية واحدة).
  #
  # كلمة سر الـ admin بتتولّد عشوائيًا وتتطبع في اللوج أول تشغيلة —
  # شوفها بـ: docker compose logs churn_airflow | findstr password
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: churn_airflow
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./joblib:/opt/airflow/joblib
    command: standalone